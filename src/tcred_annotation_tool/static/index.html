<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-CRED Annotation</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="entry-body">
    <main class="entry-shell">
      <section class="entry-panel">
        <h1>T-CRED Annotation</h1>
        <form id="annotatorForm" class="entry-form">
          <label for="annotatorInput">Annotator id</label>
          <div class="entry-control">
            <input
              id="annotatorInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              pattern="[0-9]*"
              autofocus
            />
            <button type="submit">Continue</button>
          </div>
          <p id="entryError" class="entry-error" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/entry.js"></script>
  </body>
</html>
