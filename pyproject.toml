[project]
name = "tcred-annotation-tool"
version = "1.0.0"
description = "Standalone, blinded T-CRED human-annotation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson==3.11.9",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.15.16",
]

[project.scripts]
tcred-annotation = "tcred_annotation_tool.__main__:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcred_annotation_tool = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
